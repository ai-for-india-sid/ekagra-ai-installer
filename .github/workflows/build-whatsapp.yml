name: Build WhatsApp MCP binary

# Pre-builds the WhatsApp MCP bridge (Sealjay/mcp-whatsapp) so end users never
# need Homebrew, Go, or a compiler. Everything builds on ONE Apple Silicon
# runner: arm64 natively, and amd64 by cross-compiling with CGO (Apple's clang
# is a universal toolchain — `clang -arch x86_64` produces Intel binaries from
# an arm64 host). We deliberately avoid the macos-13 (Intel) runners, which are
# being deprecated and can sit queued for hours.
#
# Output: a GitHub Release tagged `whatsapp-mcp-<sha>` with:
#   whatsapp-mcp-darwin-arm64 / -amd64   (required)
#   ffmpeg-darwin-arm64        / -amd64   (optional; voice-note transcode)
# install-whatsapp.sh downloads these instead of building from source.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Sealjay/mcp-whatsapp commit SHA to build (must match config/mcp-catalog.json)"
        required: true
        default: "946c9db"

permissions:
  contents: write   # create the release + upload assets

jobs:
  build-and-release:
    runs-on: macos-14   # Apple Silicon; builds both arches
    steps:
      - name: Checkout mcp-whatsapp (full history)
        # fetch-depth: 0 pulls full history so a SHORT commit SHA (e.g. 946c9db)
        # can be checked out below. actions/checkout's `ref` can't fetch a short
        # SHA directly — it only takes a branch, tag, or full 40-char SHA.
        uses: actions/checkout@v4
        with:
          repository: Sealjay/mcp-whatsapp
          fetch-depth: 0

      - name: Pin to requested commit
        run: git checkout "${{ inputs.sha }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Build arm64 (native, CGO) — Go ad-hoc signs it for Gatekeeper
        run: |
          CGO_ENABLED=1 go build -o whatsapp-mcp-darwin-arm64 ./cmd/whatsapp-mcp
          file whatsapp-mcp-darwin-arm64
          codesign -dv whatsapp-mcp-darwin-arm64 2>&1 || true

      - name: Build amd64 (cross-compile, CGO via universal clang)
        run: |
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" \
            go build -o whatsapp-mcp-darwin-amd64 ./cmd/whatsapp-mcp
          file whatsapp-mcp-darwin-amd64

      - name: Fetch static ffmpeg for both arches (best-effort)
        run: |
          # Re-host a known static build so users don't depend on a third party
          # at install time. Non-fatal: if a source ever rots, the bridge still
          # ships and voice-note transcoding just degrades.
          fetch() { curl -fL --retry 3 -o "$1" "$2" && chmod +x "$1" || echo "skip $1 (non-fatal)"; }
          fetch ffmpeg-darwin-arm64 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64"
          fetch ffmpeg-darwin-amd64 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64"

      - name: Publish / update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: whatsapp-mcp-${{ inputs.sha }}
        run: |
          ls -la whatsapp-mcp-darwin-* ffmpeg-darwin-* 2>/dev/null || true
          # Create the release once; if it already exists, just re-upload assets.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "WhatsApp MCP prebuilt (${{ inputs.sha }})" \
                 --notes "Prebuilt Sealjay/mcp-whatsapp @ ${{ inputs.sha }} for macOS arm64 + amd64, plus static ffmpeg. Consumed by install-whatsapp.sh."
          gh release upload "$TAG" whatsapp-mcp-darwin-arm64 whatsapp-mcp-darwin-amd64 --repo "$GITHUB_REPOSITORY" --clobber
          # ffmpeg is optional — upload only what actually downloaded.
          for f in ffmpeg-darwin-arm64 ffmpeg-darwin-amd64; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
